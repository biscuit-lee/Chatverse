version: "3.9"

services:
  backend:
    build: ./backend
    container_name: chatverse-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: chatverse-db
    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    

volumes:
  postgres_data: