spring:
  application:
    name: chatverse

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  sql:
    init:
      mode: always
      schema-locations: classpath:db/add_search_vector.sql
  
logging:
  level:
    org.springframework.web: DEBUG
