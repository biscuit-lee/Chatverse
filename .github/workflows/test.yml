name: My first ci

on:
  push:
    branches: [main]
jobs:
  java-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/chatverse

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
      - run: ./mvnw test